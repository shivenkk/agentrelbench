name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Upper-bounded so a future ruff release cannot turn CI red without a
          # code change of ours.
          python -m pip install "ruff>=0.6,<0.7"
          python -m pip install ".[dev,figures]"

      - name: Lint
        run: ruff check .

      - name: Test
        # The acceptance test drives the real EnterpriseOps-Gym containers over
        # HTTP, which are not available here. Everything else is offline.
        run: pytest -q -m "not needs_containers"

      - name: Reproduce the paper's numbers from released data
        # The same gates scripts/reproduce.sh runs: every figure and every
        # headline number is re-derived under assertions that fail loudly.
        run: |
          python scripts/make_figures.py
          python scripts/make_appendix_e.py
          python scripts/audit_numbers.py

      - name: Confirm the generated tables are byte-reproducible
        # The generated tables carry every number the paper cites, and they are
        # plain text, so they must come out byte-identical anywhere. A diff here
        # means the artifact and the paper have drifted.
        #
        # The rendered figures are deliberately NOT byte-compared. Their bytes
        # depend on CPU architecture: regenerating on linux/amd64 with the same
        # matplotlib (3.11.1) and freetype (2.14.3) as the arm64 machine that
        # produced them yields different PNGs and two different PDFs, because
        # rasterization rounds differently. Figure *content* is gated instead, by
        # the assertions inside make_figures.py that ran in the previous step
        # (7 damage pairs, 5 stochastic cells across 3 models, 48 events, 0
        # always-fail cells, and the frozen 13-pair development pool).
        run: git diff --exit-code -- docs/appendix-e-tables.md paper/appendix-e.tex

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
