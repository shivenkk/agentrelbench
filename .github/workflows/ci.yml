name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Upper-bounded so a future ruff release cannot turn CI red without a
          # code change of ours.
          python -m pip install "ruff>=0.6,<0.7"
          python -m pip install ".[dev,figures]"

      - name: Lint
        run: ruff check .

      - name: Test
        # The acceptance test drives the real EnterpriseOps-Gym containers over
        # HTTP, which are not available here. Everything else is offline.
        run: pytest -q -m "not needs_containers"

      - name: Reproduce the paper's numbers from released data
        # The same gates scripts/reproduce.sh runs: every figure and every
        # headline number is re-derived under assertions that fail loudly.
        run: |
          python scripts/make_figures.py
          python scripts/make_appendix_e.py
          python scripts/audit_numbers.py

      - name: Confirm regeneration is byte-reproducible
        # Figures and generated tables must come out identical to what is
        # committed. A diff here means the artifact and the paper have drifted.
        run: git diff --exit-code -- docs/figs docs/appendix-e-tables.md paper/appendix-e.tex

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
