[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentrelbench"
version = "0.1.0"
description = "k-run wrapper for the EnterpriseOps-Gym benchmark: drives evaluate.py k times per task, archiving per-run DB state exports plus a batch manifest."
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Shiven Khurdi", email = "khurdi.s@northeastern.edu" },
]
keywords = ["llm-agents", "benchmark", "reliability", "agent-safety", "evaluation"]
dependencies = [
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/shivenkk/agentrelbench"
Repository = "https://github.com/shivenkk/agentrelbench"
Issues = "https://github.com/shivenkk/agentrelbench/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
]
# The analysis path (scripts/reproduce.sh: figures, Appendix E tables, the
# manuscript number audit). The estimators themselves are pure stdlib; only
# plotting needs a third-party package.
figures = [
    "matplotlib>=3.7",
]

[project.scripts]
arb-run = "agentrelbench.cli:entrypoint"
arb-label = "agentrelbench.labeling:entrypoint"
arb-validate = "agentrelbench.validate:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrelbench"]

# The published task suite and its seed databases ship inside the wheel, not just
# the sdist. Without this, `pip install agentrelbench` gives the code but none of
# the tasks, which is the one use case this package exists to serve: bring your
# own model, run it against the published suite. Locate them after install with
#   python -c "import agentrelbench,pathlib;print(pathlib.Path(agentrelbench.__file__).parent/'suite')"
[tool.hatch.build.targets.wheel.force-include]
"tasks" = "agentrelbench/suite/tasks"
"tasks-escalated" = "agentrelbench/suite/tasks-escalated"
# Mapped to suite/data/seed-dbs, not suite/seed-dbs: the task JSONs carry the
# repo-relative path "data/seed-dbs/...", and find_repo_root anchors on that
# directory existing. Flatten it and every packaged task ships unrunnable.
"data/seed-dbs" = "agentrelbench/suite/data/seed-dbs"
# arb-label reads the per-domain primary-key and volatile-column registries, and
# arb-validate execs the scripted responder. Both resolved through a path that
# only exists in a checkout, so two of the three console scripts were unusable
# from a pip install. See labeling._default_data_dir / validate._responder_script.
"data/eog" = "agentrelbench/suite/data/eog"
"m1_spike/scripted_responder.py" = "agentrelbench/suite/scripted_responder.py"

# An allowlist, deliberately, not an exclude list. hatchling ships anything not
# gitignored by default, which swept in local editor and test caches, the frozen
# audit trees, and the LaTeX sources. Naming what ships means anything added
# later stays out by default rather than by being remembered.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/tasks",
  "/tasks-escalated",
  "/data",
  "/scripts",
  "/docs",
  # The wheel is built from the unpacked sdist, so anything the wheel
  # force-includes must exist here too or the build fails outright.
  "/m1_spike/scripted_responder.py",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]
# docs/ ships the specs, results, appendices, pre-registration, and audit
# evidence: those are the research record, and the pre-registration in particular
# is what makes the paper's demotion claim checkable.
#
# Excluded below is planning material only, and only where nothing that ships
# refers to it: the release checklist's working notes, the superseded paper
# skeleton, and the M1 gate memo. Anything a shipped file cites stays in, because
# a dangling reference is worse than a slightly untidy package. That rule is why
# task-design-m4.md ships (10 RATIONALE.md files cite it) and paper-draft.md
# ships (scripts/audit_numbers.py reads it).
#
# The planning files below are also untracked via .git/info/exclude, and both
# mechanisms are needed. git's exclude file keeps them out of the REPOSITORY;
# hatchling does not read it and would otherwise ship anything sitting on disk
# under an included directory. Repository-clean and distribution-clean are
# separate surfaces: verify each on its own terms.
exclude = [
  "/docs/M1-go-no-go.md",
  "/docs/release-checklist.md",
  "/docs/paper-skeleton.md",
  "**/PROGRESS.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_containers: requires the EnterpriseOps-Gym MCP containers to be running",
]

[tool.ruff]
line-length = 100
# The audit trees are frozen evidence for Appendix C, not maintained code. They
# ran once, their output is committed, and relinting them now would mean editing
# the scripts that produced published results.
extend-exclude = ["m1_audit", "m1_spike", "m4_reaudit"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "SIM", "RUF", "ASYNC"]
ignore = [
    # Long explanatory comments are deliberate in the measurement core: several
    # document substrate hazards that cost real debugging to find.
    "E501",
    # Both of the following are real and deliberately deferred rather than fixed
    # days before a release. They mean editing working, tested code on the paths
    # that produce published numbers.
    #   ASYNC230: 14 blocking open() calls inside async functions.
    #   SIM115:   13 files opened without a context manager.
    "ASYNC230",
    "SIM115",
    # ruff 0.6 predates PEP 639, so it rejects the valid `license-files` key.
    # hatchling accepts it and emits License-Expression: Apache-2.0.
    "RUF200",
    # Non-ASCII characters here are deliberate, not homoglyph typos: the keys of
    # fetch_bib.UNICODE_FIX are the literal characters that occur in arXiv titles
    # and must match them exactly, and docstrings use real math notation.
    "RUF001",
    "RUF002",
]
