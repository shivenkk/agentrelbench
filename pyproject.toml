[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentrelbench"
version = "0.1.0"
description = "k-run wrapper for the EnterpriseOps-Gym benchmark: drives evaluate.py k times per task, archiving per-run DB state exports plus a batch manifest."
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Shiven Khurdi", email = "khurdi.s@northeastern.edu" },
]
keywords = ["llm-agents", "benchmark", "reliability", "agent-safety", "evaluation"]
dependencies = [
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/shivenkk/agentrelbench"
Repository = "https://github.com/shivenkk/agentrelbench"
Issues = "https://github.com/shivenkk/agentrelbench/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
]
# The analysis path (scripts/reproduce.sh: figures, Appendix E tables, the
# manuscript number audit). The estimators themselves are pure stdlib; only
# plotting needs a third-party package.
figures = [
    "matplotlib>=3.7",
]

[project.scripts]
arb-run = "agentrelbench.cli:entrypoint"
arb-label = "agentrelbench.labeling:entrypoint"
arb-validate = "agentrelbench.validate:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrelbench"]
# PROGRESS.md files are internal task-authoring scaffolding ("M4 csm batch, build
# progress, delegated"). RATIONALE.md files stay: they document each task's damage
# lever and the seed data the tension is built from, which a user of the suite wants.
exclude = ["**/PROGRESS.md"]

# The published task suite and its seed databases ship inside the wheel, not just
# the sdist. Without this, `pip install agentrelbench` gives the code but none of
# the tasks, which is the one use case this package exists to serve: bring your
# own model, run it against the published suite. Locate them after install with
#   python -c "import agentrelbench,pathlib;print(pathlib.Path(agentrelbench.__file__).parent/'suite')"
[tool.hatch.build.targets.wheel.force-include]
"tasks" = "agentrelbench/suite/tasks"
"tasks-escalated" = "agentrelbench/suite/tasks-escalated"
# Mapped to suite/data/seed-dbs, not suite/seed-dbs: the task JSONs carry the
# repo-relative path "data/seed-dbs/...", and find_repo_root anchors on that
# directory existing. Flatten it and every packaged task ships unrunnable.
"data/seed-dbs" = "agentrelbench/suite/data/seed-dbs"

# An allowlist, deliberately, not an exclude list. hatchling's default is to ship
# anything not gitignored, which quietly published CLAUDE.md (AI tooling
# instructions), .hypothesis/ (test cache), the m1_audit / m1_spike / m4_reaudit
# trees, and paper/ (LaTeX source). Naming what ships means anything added later
# stays out by default rather than by being remembered.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/tasks",
  "/tasks-escalated",
  "/data",
  "/scripts",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]
# docs/ ships the instrument specs, results, and appendices. These are internal
# process material: a draft of the paper, the decision log, and the release
# checklist's working notes. Excluding them extends the repo's existing
# "internal docs are not part of the released artifact" decision to the sdist.
exclude = [
  "/docs/release-checklist.md",
  "/docs/paper-draft.md",
  "/docs/paper-skeleton.md",
  "/docs/problem-and-hypothesis.md",
  "/docs/M1-go-no-go.md",
  "/docs/task-design-m4.md",
  "**/PROGRESS.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
